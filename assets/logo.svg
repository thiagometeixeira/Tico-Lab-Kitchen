<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none" role="img" aria-label="Tico Lab Kitchen">
  <rect width="520" height="120" fill="#000"/>
  <g transform="translate(14 10)">
    <defs>
      <linearGradient id="aco" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f4f4f5"/>
        <stop offset="0.35" stop-color="#a1a1aa"/>
        <stop offset="0.6" stop-color="#e4e4e7"/>
        <stop offset="1" stop-color="#52525b"/>
      </linearGradient>
      <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#26262c"/>
        <stop offset="1" stop-color="#0b0b0e"/>
