      <radialGradient id="fundoHex" cx="0.5" cy="0.25" r="0.8">
        <stop offset="0" stop-color="#1c1c22"/>
        <stop offset="1" stop-color="#050507"/>
      </radialGradient>
      <pattern id="colmeia" width="4.503" height="7.800" patternUnits="userSpaceOnUse"><path d="M0.00 -2.60 L2.25 -1.30 L2.25 1.30 L0.00 2.60 L-2.25 1.30 L-2.25 -1.30 Z M4.50 -2.60 L6.75 -1.30 L6.75 1.30 L4.50 2.60 L2.25 1.30 L2.25 -1.30 Z M2.25 1.30 L4.50 2.60 L4.50 5.20 L2.25 6.50 L0.00 5.20 L0.00 2.60 Z M0.00 5.20 L2.25 6.50 L2.25 9.10 L0.00 10.40 L-2.25 9.10 L-2.25 6.50 Z M4.50 5.20 L6.75 6.50 L6.75 9.10 L4.50 10.40 L2.25 9.10 L2.25 6.50 Z" fill="none" stroke="#b4b4bc" stroke-width="0.7" opacity="0.85"/></pattern>
    </defs>
    <!-- corpo e moldura de aço -->
    <path d="M6 8 H94 L86 32 H61 V80 L50 94 L39 80 V32 H14 Z" fill="url(#corpo)" stroke="url(#aco)" stroke-width="3" stroke-linejoin="round"/>
    <!-- miolo em colmeia -->
    <path d="M15.5 15 H84.5 L80.5 26 H55 V77.5 L50 84 L45 77.5 V26 H19.5 Z" fill="url(#fundoHex)"/>
    <path d="M15.5 15 H84.5 L80.5 26 H55 V77.5 L50 84 L45 77.5 V26 H19.5 Z" fill="url(#colmeia)"/>
    <!-- filete laranja (assinatura Kitchen) -->
    <path d="M15.5 15 H84.5 L80.5 26 H55 V77.5 L50 84 L45 77.5 V26 H19.5 Z" fill="none" stroke="#ff6600" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="130" y="66" font-size="40" font-weight="800" letter-spacing="2">TICO <tspan font-weight="300">LAB</tspan> <tspan fill="#ff6600">KITCHEN</tspan></text>
    <text x="132" y="92" font-size="12.5" font-weight="500" letter-spacing="4" fill="#a1a1aa">PRECISÃO &amp; ENGENHARIA GASTRONÔMICA</text>
  </g>
