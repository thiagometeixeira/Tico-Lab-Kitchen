<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 64" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#flaskGrad)" stroke="#334155" stroke-width="1"/>
    
    <!-- Erlenmeyer flask body -->
    <path d="M23 19h10v4l6.5 13A4 4 0 0 1 35.9 42H20.1a4 4 0 0 1-3.6-6L23 23v-4z" 
          stroke="#f8fafc" stroke-width="2.2" stroke-linejoin="round" fill="#0f172a"/>
    
    <!-- Measurement lines -->
    <line x1="22" y1="32" x2="26" y2="32" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="36" x2="25" y2="36" stroke="#fb923c" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Fluid level -->
    <path d="M18.8 38c2.2-1 4.5 1 7.2 0s4.5-1 6.8 0l1.2 2.5a2 2 0 0 1-1.8 2.5H20a2 2 0 0 1-1.8-2.5l0.6-2.5z" 
          fill="url(#flameGrad)" opacity="0.85"/>
    
    <!-- Flame rising from top -->
    <path d="M28 9c-2.8 3.5-4.2 5.2-2.5 8.5 1.5 3 4.2 1 4.2-1.5 1.3 2.2 3 1.5 1.7-2.2-0.9-2.5-2.4-3.5-3.4-4.8z" 
          fill="url(#flameGrad)"/>
  </g>

  <!-- Logotype Typography -->
  <g transform="translate(74, 33)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="21" font-weight="800" letter-spacing="1.5" fill="currentColor">
      TICO LAB
    </text>
    <text x="108" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="21" font-weight="300" letter-spacing="1.5" fill="#f97316">
      KITCHEN
    </text>
    <text x="1" y="16" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" 
          font-size="9" font-weight="600" letter-spacing="2.2" fill="#94a3b8">
      CULINÁRIA COM RIGOR DE LABORATÓRIO
    </text>
  </g>
</svg>
